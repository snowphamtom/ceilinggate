<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CeilingGate · Demo video</title>
    <style>
      html, body { margin: 0; background: #070b14; color: #e8eefc; font-family: system-ui, sans-serif; }
      main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 1.15rem; font-weight: 600; }
      p, .chip { color: #9aa8c2; font-size: 0.92rem; }
      .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
      video { width: 100%; height: 100%; object-fit: contain; background: #000; }
      a { color: #8ec5ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>CeilingGate demo</h1>
      <p>ABR: HLS when /hls/master.m3u8 is on this origin, else progressive rung by downlink.</p>
      <p class="chip" id="lab">idle</p>
      <div class="frame">
        <video id="reel" controls playsinline preload="none" poster="https://github.com/snowphamtom/ceilinggate/releases/download/allgas-demo-20260905/02-grant.png"></video>
      </div>
      <p><a href="/">Back to app</a> · <a href="/hls/master.m3u8">HLS master</a></p>
    </main>
    <script>
      const LOW = "https://github.com/snowphamtom/ceilinggate/releases/download/allgas-demo-20260905/CeilingGate-AllGas-demo-60s.mp4";
      const HIGH = "https://github.com/snowphamtom/ceilinggate/releases/download/allgas-demo-20260905/CeilingGate-AllGas-demo.mp4";
      const MASTER = "/hls/master.m3u8";
      const v = document.getElementById("reel");
      const lab = document.getElementById("lab");
      function pick() {
        const c = navigator.connection || {};
        if (c.saveData || c.effectiveType === "2g" || c.effectiveType === "slow-2g") return { url: LOW, label: "low · save" };
        if (typeof c.downlink === "number" && c.downlink > 0 && c.downlink < 0.25) return { url: LOW, label: "low · " + c.downlink + "Mb/s" };
        return { url: HIGH, label: "high · progressive" };
      }
      async function attach() {
        try {
          const r = await fetch(MASTER, { cache: "no-store" });
          const t = r.ok ? await r.text() : "";
          if (t.includes("#EXTM3U")) {
            if (v.canPlayType("application/vnd.apple.mpegurl")) {
              v.src = MASTER; lab.textContent = "HLS native · ABR"; return;
            }
            await new Promise((res, rej) => {
              const s = document.createElement("script");
              s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";
              s.onload = res; s.onerror = rej; document.head.appendChild(s);
            });
            if (window.Hls && Hls.isSupported()) {
              const hls = new Hls({ capLevelToPlayerSize: true, startLevel: -1 });
              hls.loadSource(MASTER);
              hls.attachMedia(v);
              lab.textContent = "HLS ABR";
              hls.on(Hls.Events.LEVEL_SWITCHED, () => {
                const lv = hls.levels[hls.currentLevel];
                if (lv) lab.textContent = "HLS ABR · " + (lv.height || "?") + "p";
              });
              return;
            }
          }
        } catch (e) {}
        const p = pick();
        v.src = p.url;
        lab.textContent = p.label;
      }
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((ents) => {
          if (ents.some((e) => e.isIntersecting)) { attach(); io.disconnect(); }
        }, { threshold: 0.2 });
        io.observe(v);
      } else attach();
    </script>
  </body>
</html>
