<!DOCTYPE html>
<html lang="en" data-forge-self-style="1">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorting Machine — C ≤ S</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --line: rgba(15, 30, 60, 0.12);
      --ink: #0b1220;
      --mute: #5b6b82;
      --cyan: #00c2ff;
      --blue: #3d6bff;
      --violet: #7a3dff;
      --grant: #00a86b;
      --grant-glow: rgba(0, 168, 107, 0.28);
      --refuse: #e11d48;
      --refuse-glow: rgba(225, 29, 72, 0.22);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font);
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(0, 194, 255, 0.12), transparent 55%),
        radial-gradient(800px 420px at 100% 0%, rgba(122, 61, 255, 0.1), transparent 50%),
        var(--bg);
      padding: 1.25rem 1.1rem 2.5rem;
    }
    .shell { max-width: 46rem; margin: 0 auto; }
    .kicker {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--cyan); font-weight: 700;
      margin-bottom: 0.55rem;
    }
    .kicker::before {
      content: "//"; color: var(--violet); letter-spacing: 0;
    }
    h1 {
      margin: 0 0 0.4rem; font-size: clamp(1.8rem, 5vw, 2.35rem);
      letter-spacing: -0.03em; font-weight: 800; color: var(--ink);
    }
    .lede {
      margin: 0 0 1.1rem; color: var(--mute); line-height: 1.5; font-size: 0.98rem;
    }
    .lede strong { color: var(--ink); }
    .stages {
      display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 1.15rem;
      font-family: var(--mono); font-size: 0.72rem;
    }
    .stages span {
      padding: 0.35rem 0.65rem; border-radius: 999px; border: 1px solid var(--line);
      color: var(--mute); background: #fff;
    }
    .stages span.on {
      color: var(--grant); border-color: rgba(0, 168, 107, 0.45);
      background: rgba(0, 168, 107, 0.1); font-weight: 700;
      box-shadow: 0 0 14px var(--grant-glow);
    }
    .panel {
      border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1rem 1.1rem;
      background: var(--panel);
      box-shadow: 0 10px 32px rgba(15, 30, 60, 0.08);
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
    }
    label {
      display: block; margin: 0.7rem 0 0; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--cyan); font-weight: 700;
      font-family: var(--mono);
    }
    label::before { content: "// "; opacity: 0.65; }
    input {
      display: block; width: 100%; margin-top: 0.35rem; padding: 0.75rem 0.8rem;
      border-radius: 10px; border: 1px solid var(--line); background: #fff;
      color: var(--ink); font-family: var(--mono); font-size: 0.95rem;
    }
    input:focus { outline: 2px solid rgba(0, 194, 255, 0.45); border-color: var(--cyan); }
    .row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
    button {
      appearance: none; cursor: pointer; font-family: inherit; font-weight: 800;
      letter-spacing: 0.04em; border-radius: 12px; padding: 0.78rem 1.05rem; border: 0;
    }
    button.primary {
      background: linear-gradient(180deg, #5a8cff, var(--blue));
      color: #fff; box-shadow: 0 4px 14px rgba(61, 107, 255, 0.28);
    }
    button.ghost {
      background: #fff; color: var(--ink);
      border: 1px solid rgba(15, 30, 60, 0.22);
    }
    button.grantish {
      background: linear-gradient(180deg, #12c47a, var(--grant)); color: #fff;
      box-shadow: 0 6px 18px var(--grant-glow);
      border: 1px solid rgba(0, 168, 107, 0.35);
    }
    button.refuseish {
      background: linear-gradient(180deg, #f0436a, var(--refuse)); color: #fff;
      box-shadow: 0 6px 18px var(--refuse-glow);
      border: 1px solid rgba(225, 29, 72, 0.35);
    }
    #out { margin-top: 1.15rem; min-height: 4rem; }
    .await {
      border: 1.5px dashed rgba(15, 30, 60, 0.2); border-radius: 14px; padding: 1.6rem 1rem;
      text-align: center; color: var(--cyan); font-family: var(--mono);
      letter-spacing: 0.12em; font-weight: 700; background: #fff;
    }
    .await small { display: block; margin-top: 0.45rem; color: var(--mute);
      letter-spacing: 0; font-weight: 500; text-transform: none; }
    .card {
      border-radius: 16px; padding: 1.15rem 1.05rem 1.2rem; border: 2px solid var(--line);
      background: #fff;
    }
    .card.grant {
      border-color: var(--grant);
      box-shadow: 0 0 36px var(--grant-glow), inset 0 0 40px rgba(0, 168, 107, 0.04);
      background: linear-gradient(165deg, rgba(0, 168, 107, 0.06), #fff);
    }
    .card.refuse {
      border-color: var(--refuse);
      box-shadow: 0 0 36px var(--refuse-glow), inset 0 0 40px rgba(225, 29, 72, 0.04);
      background: linear-gradient(165deg, rgba(225, 29, 72, 0.05), #fff);
    }
    .stamp-wrap { margin: 0.15rem 0 0.85rem; }
    .eyebrow {
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--cyan); font-weight: 700; margin-bottom: 0.4rem;
    }
    .eyebrow::before { content: "// "; opacity: 0.7; }
    .stamp {
      display: inline-block; padding: 0.55rem 1.15rem; border-radius: 10px;
      font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 900; letter-spacing: 0.14em;
      line-height: 1; border: 2px solid currentColor;
    }
    .card.grant .stamp {
      color: #fff; background: linear-gradient(180deg, #12c47a, var(--grant));
      border-color: var(--grant);
      box-shadow: 0 0 28px var(--grant-glow);
    }
    .card.refuse .stamp {
      color: #fff; background: linear-gradient(180deg, #f0436a, var(--refuse));
      border-color: var(--refuse);
      box-shadow: 0 0 28px var(--refuse-glow);
    }
    .meta { color: var(--mute); font-family: var(--mono); font-size: 0.82rem; margin-bottom: 0.85rem; }
    .bars { display: grid; gap: 0.55rem; margin: 0.85rem 0 1rem; }
    .bar-row {
      display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 0.55rem; align-items: center;
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em;
    }
    .bar-track {
      position: relative; height: 1.15rem; border-radius: 6px; background: #f0f4fa;
      border: 1px solid var(--line); overflow: visible;
    }
    .bar-fill {
      height: 100%; border-radius: 5px; width: var(--w, 50%);
      background: linear-gradient(90deg, var(--grant), #12c47a);
      box-shadow: 0 0 10px rgba(0, 168, 107, 0.25);
    }
    .bar-row.fail .bar-fill {
      background: linear-gradient(90deg, var(--refuse), #f0436a);
      box-shadow: 0 0 10px rgba(225, 29, 72, 0.3);
    }
    .bar-edge {
      position: absolute; top: -3px; bottom: -3px; left: var(--edge, 70%);
      border-left: 1.5px dashed var(--violet); opacity: 0.9;
    }
    .chip {
      display: inline-block; min-width: 4.2rem; text-align: center;
      padding: 0.28rem 0.45rem; border-radius: 7px; font-weight: 800;
      border: 1px solid transparent;
    }
    .chip.ok {
      color: var(--grant); background: rgba(0, 168, 107, 0.1); border-color: rgba(0, 168, 107, 0.4);
      box-shadow: 0 0 10px rgba(0, 168, 107, 0.12);
    }
    .chip.bad {
      color: var(--refuse); background: rgba(225, 29, 72, 0.1); border-color: rgba(225, 29, 72, 0.45);
      box-shadow: 0 0 10px rgba(225, 29, 72, 0.14);
    }
    .over-tab {
      position: absolute; left: calc(var(--edge, 70%) + 4px); top: 50%; transform: translateY(-50%);
      background: var(--refuse); color: #fff; font-size: 0.65rem; font-weight: 800;
      padding: 0.12rem 0.35rem; border-radius: 4px; box-shadow: 0 0 12px var(--refuse-glow);
    }
    table {
      width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.84rem;
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff;
    }
    th, td { text-align: left; padding: 0.5rem 0.55rem; border-bottom: 1px solid var(--line); }
    th {
      font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
      background: #f4f7fb; color: var(--mute);
    }
    tr.fail td { color: #be123c; background: rgba(225, 29, 72, 0.08); }
    .admit {
      margin-top: 0.85rem; padding: 0.65rem 0.75rem; border-radius: 10px;
      font-size: 0.82rem; line-height: 1.4;
    }
    .card.grant .admit {
      background: rgba(0, 168, 107, 0.08); border: 1px solid rgba(0, 168, 107, 0.35); color: var(--grant);
    }
    .card.refuse .admit {
      background: rgba(225, 29, 72, 0.08); border: 1px solid rgba(225, 29, 72, 0.35); color: var(--refuse);
    }
    .back { margin-top: 1.25rem; }
    .back a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    .legend { margin: 0.35rem 0 0.8rem; color: var(--mute); font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="kicker">Expense check · sorting machine</div>
    <h1>Sorting machine</h1>
    <p class="lede">One law: <strong>C ≤ S</strong> (claimed ≤ source) componentwise. Bucket <strong>GRANT</strong> or <strong>REFUSE</strong> — never chat yes/no. Starts empty.</p>
    <div class="stages" id="stages">
      <span>1 Intake</span><span>2 Filter</span><span>3 Evidence</span><span>4 Verdict</span><span>5 Store</span>
    </div>
    <div class="panel">
      <label>Claimed (C)<input id="claimed" value="" placeholder="98, 49, 25, 9" autocomplete="off" /></label>
      <label>Source (S)<input id="source" value="" placeholder="100, 50, 25, 10" autocomplete="off" /></label>
      <div class="row">
        <button type="button" class="grantish" id="loadG">Load GRANT</button>
        <button type="button" class="refuseish" id="loadR">Load REFUSE</button>
        <button type="button" class="ghost" id="reset">Reset</button>
        <button type="button" class="primary" id="run">Sort C ≤ S</button>
      </div>
    </div>
    <div id="out"><div class="await">AWAITING LEDGER<small>Load a fixture or enter C / S, then Sort</small></div></div>
    <p class="back"><a href="/">← CeilingGate board</a></p>
  </div>
  <script>
    function parseList(s) {
      return s.split(/[\s,]+/).map(x => x.trim()).filter(Boolean).map(Number).filter(n => Number.isFinite(n));
    }
    function enclosed(S, C) {
      if (S.length !== C.length || !S.length) return false;
      for (let i = 0; i < S.length; i++) if (!(C[i] <= S[i])) return false;
      return true;
    }
    function breaches(S, C, idx) {
      if (!S.length || !C.length) return [];
      const rest = breaches(S.slice(1), C.slice(1), idx + 1);
      return S[0] < C[0] ? [idx, ...rest] : rest;
    }
    function maskOf(failed) { return failed.reduce((a, i) => a | (1 << i), 0); }
    function gateB(S, C) {
      if (enclosed(S, C)) return { status: "grant", mask: 0, failed: [] };
      const failed = breaches(S, C, 0);
      const m = maskOf(failed);
      return { status: "refuse", mask: m === 0 ? 1 : m, failed };
    }
    const labels = ["FUEL", "LODGING", "MEALS", "MISC"];
    const cEl = document.getElementById("claimed");
    const sEl = document.getElementById("source");
    const out = document.getElementById("out");
    const stageEls = [...document.querySelectorAll("#stages span")];
    function mark(n) {
      stageEls.forEach((el, i) => el.classList.toggle("on", i < n));
    }
    function awaiting() {
      out.innerHTML = `<div class="await">AWAITING LEDGER<small>Load a fixture or enter C / S, then Sort</small></div>`;
    }
    document.getElementById("loadG").onclick = () => {
      cEl.value = "98, 49, 25, 9"; sEl.value = "100, 50, 25, 10"; mark(1); awaiting();
    };
    document.getElementById("loadR").onclick = () => {
      cEl.value = "90, 60, 20, 10"; sEl.value = "100, 50, 25, 10"; mark(1); awaiting();
    };
    document.getElementById("reset").onclick = () => {
      cEl.value = ""; sEl.value = ""; mark(0); awaiting();
    };
    document.getElementById("run").onclick = () => {
      const C = parseList(cEl.value);
      const S = parseList(sEl.value);
      if (!C.length || !S.length) { awaiting(); return; }
      mark(4);
      const d = gateB(S, C);
      mark(5);
      const n = Math.max(C.length, S.length);
      const maxS = Math.max(...S, 1);
      let bars = "";
      let rows = "";
      for (let i = 0; i < n; i++) {
        const c = C[i] ?? 0, s = S[i] ?? 0;
        const over = Number.isFinite(C[i]) && Number.isFinite(S[i]) && C[i] > S[i];
        const name = labels[i] || ("L" + i);
        const w = Math.min(100, (Math.max(c, s) / (maxS * 1.15)) * 100);
        const edge = Math.min(98, (s / (maxS * 1.15)) * 100);
        const fillW = Math.min(100, (c / (maxS * 1.15)) * 100);
        bars += `<div class="bar-row ${over ? "fail" : ""}"><div>${name}</div>
          <div class="bar-track" style="--edge:${edge}%"><div class="bar-fill" style="width:${fillW}%"></div>
          <div class="bar-edge"></div>${over ? `<span class="over-tab">+$${Math.round(c - s)}</span>` : ""}</div>
          <span class="chip ${over ? "bad" : "ok"}">${over ? "C > S" : "C ≤ S"}</span></div>`;
        rows += `<tr class="${over ? "fail" : ""}"><td>${name}</td><td>${c}</td><td>${s}</td>
          <td><span class="chip ${over ? "bad" : "ok"}">${over ? "OVER" : "CLEAR"}</span></td></tr>`;
      }
      const bucket = d.status === "grant" && d.mask === 0 ? "GRANT" : "REFUSE";
      const eye = bucket === "GRANT" ? "ALL LINES CLEAR" : "OVER THE RECEIPT";
      const admit = bucket === "GRANT"
        ? "ADMIT: every line claimed ≤ on-receipt (componentwise) — no total-only offset."
        : "Surplus on one line cannot cover a deficit on another — REFUSE while any line is over.";
      out.innerHTML = `<div class="card ${d.status}">
        <div class="stamp-wrap"><div class="eyebrow">${eye}</div>
          <div class="stamp">${bucket}</div></div>
        <div class="meta">mask ${d.mask}${d.mask === 0 ? " · all lines C ≤ S" : " · fail [" + d.failed.join(",") + "]"}</div>
        <p class="legend"><strong>RECEIPT</strong> Dashed edge is the receipt. A tab past it is the overclaim.</p>
        <div class="bars">${bars}</div>
        <table><thead><tr><th>LINE</th><th>CLAIMED (C)</th><th>SOURCE (S)</th><th>C≤S</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <div class="admit">${admit}</div>
      </div>`;
    };
  </script>
</body>
</html>
