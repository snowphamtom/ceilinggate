<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorting Machine — C ≤ S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --void:#070b14; --amber:#d4a24c; --grant:#1f9d63; --refuse:#e04545;
      font-family: "IBM Plex Sans", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background:
      radial-gradient(900px 400px at 10% -10%, rgba(91,157,255,0.12), transparent 50%), var(--void);
      color: #eef3fb; padding: 1.35rem; max-width: 44rem; }
    h1 { font-size: 1.55rem; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
    h1::before { content: "SORT · "; color: var(--amber); font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem; letter-spacing: 0.14em; vertical-align: middle; }
    .lede { color: #a8bdd8; font-size: 0.95rem; margin: 0 0 1rem; line-height: 1.45; }
    label { display: block; margin: 0.55rem 0; font-size: 0.78rem; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--amber); font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 0.3rem;
      padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid #2a3a55;
      background: #0a1220; color: #e8eef7; font-family: "IBM Plex Mono", monospace; font-size: 0.9rem; }
    .row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.85rem; }
    button { padding: 0.6rem 0.95rem; border-radius: 8px; border: 0;
      background: linear-gradient(#4a8dff,#2a6df4); color: #fff; font-weight: 700;
      letter-spacing: 0.04em; cursor: pointer; font-family: inherit; }
    button.ghost { background: transparent; border: 1px solid #94a3b8; color: #e8eef7; font-weight: 600; }
    .card { margin-top: 1rem; padding: 1.05rem; border-radius: 12px; border: 2px solid #2a3a55; }
    .card.grant { border-color: var(--grant); box-shadow: 0 0 36px rgba(31,157,99,0.35); background: rgba(31,157,99,0.1); }
    .card.refuse { border-color: var(--refuse); box-shadow: 0 0 36px rgba(224,69,69,0.35); background: rgba(224,69,69,0.1); }
    .card h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.12em; }
    table { width:100%; border-collapse: collapse; margin-top:0.75rem; font-size:0.88rem;
      border: 1px solid #243552; border-radius: 8px; overflow: hidden; }
    th, td { text-align:left; padding:0.45rem 0.5rem; border-bottom:1px solid #243552;
      font-family: "IBM Plex Mono", monospace; }
    th { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; background: #152038; color: #c5d4e8; }
    tr.fail td { color:#fca5a5; background: rgba(224,69,69,0.14); }
    .stages { display:flex; flex-wrap:wrap; gap:0.45rem; margin:0.85rem 0; font-size:0.78rem;
      font-family: "IBM Plex Mono", monospace; color:#8fa3bf; }
    .stages span { padding: 0.2rem 0.45rem; border: 1px solid #2a3a55; border-radius: 999px; }
    .stages span.on { color:#6ee7a8; font-weight:700; border-color: rgba(31,157,99,0.55);
      background: rgba(31,157,99,0.12); }
    a { color: #9ec5ff; }
  </style>
</head>
<body>
  <h1>Sorting machine</h1>
  <p class="lede">One law: <strong>C ≤ S</strong> (claimed ≤ source) componentwise. Bucket GRANT or REFUSE — never chat yes/no. Starts empty.</p>
  <div class="stages" id="stages">
    <span>1 Intake</span><span>2 Filter</span><span>3 Evidence</span><span>4 Verdict</span><span>5 Store</span>
  </div>
  <label>Claimed (C)<input id="claimed" value="" placeholder="90, 60, 20, 10" /></label>
  <label>Source (S)<input id="source" value="" placeholder="100, 50, 25, 10" /></label>
  <div class="row">
    <button type="button" class="ghost" id="loadG">Load GRANT</button>
    <button type="button" class="ghost" id="loadR">Load REFUSE</button>
    <button type="button" class="ghost" id="reset">Reset</button>
    <button type="button" id="run">Sort C ≤ S</button>
  </div>
  <div id="out"></div>
  <p><a href="/">← CeilingGate board</a></p>
  <script>
    function parseList(s) {
      return s.split(/[\s,]+/).map(x => x.trim()).filter(Boolean).map(Number).filter(n => Number.isFinite(n));
    }
    function enclosed(S, C) {
      if (S.length !== C.length) return false;
      for (let i = 0; i < S.length; i++) if (!(C[i] <= S[i])) return false;
      return true;
    }
    function breaches(S, C, idx) {
      if (!S.length || !C.length) return [];
      const rest = breaches(S.slice(1), C.slice(1), idx + 1);
      return S[0] < C[0] ? [idx, ...rest] : rest;
    }
    function maskOf(failed) { return failed.reduce((a,i) => a | (1 << i), 0); }
    function gateB(S, C) {
      if (enclosed(S, C)) return { status: "grant", mask: 0, failed: [] };
      const failed = breaches(S, C, 0);
      const m = maskOf(failed);
      return { status: "refuse", mask: m === 0 ? 1 : m, failed };
    }
    const cEl = document.getElementById("claimed");
    const sEl = document.getElementById("source");
    const out = document.getElementById("out");
    const stageEls = [...document.querySelectorAll("#stages span")];
    function mark(n) {
      stageEls.forEach((el, i) => el.classList.toggle("on", i < n));
    }
    document.getElementById("loadG").onclick = () => {
      cEl.value = "98, 49, 25, 9"; sEl.value = "100, 50, 25, 10"; mark(1); out.innerHTML = "";
    };
    document.getElementById("loadR").onclick = () => {
      cEl.value = "90, 60, 20, 10"; sEl.value = "100, 50, 25, 10"; mark(1); out.innerHTML = "";
    };
    document.getElementById("reset").onclick = () => {
      cEl.value = ""; sEl.value = ""; mark(0); out.innerHTML = "";
    };
    document.getElementById("run").onclick = () => {
      const C = parseList(cEl.value);
      const S = parseList(sEl.value);
      mark(4);
      const d = gateB(S, C);
      mark(5);
      const n = Math.max(C.length, S.length);
      let rows = "";
      for (let i = 0; i < n; i++) {
        const c = C[i] ?? 0, s = S[i] ?? 0;
        const over = Number.isFinite(C[i]) && Number.isFinite(S[i]) && C[i] > S[i];
        rows += `<tr class="${over ? "fail" : ""}"><td>${i}</td><td>${c}</td><td>${s}</td><td>${over ? "C > S" : "C ≤ S"}</td></tr>`;
      }
      const bucket = d.status === "grant" && d.mask === 0 ? "GRANT" : "REFUSE";
      out.innerHTML = `<div class="card ${d.status}"><strong>Bucket ${bucket}</strong>
        <div>mask ${d.mask}${d.mask === 0 ? " · all lines C ≤ S" : " · fail [" + d.failed.join(",") + "]"}</div>
        <table><thead><tr><th>LINE</th><th>C</th><th>S</th><th>C≤S</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    };
  </script>
</body>
</html>
