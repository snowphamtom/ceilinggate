<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Line Check — LIVE</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b1220; color: #e8eef7; padding: 1.25rem; max-width: 28rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .lede { color: #a8bdd8; font-size: 0.92rem; margin: 0 0 1rem; }
    label { display: block; margin: 0.55rem 0; font-size: 0.85rem; color: #a8bdd8; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 0.25rem;
      padding: 0.55rem 0.65rem; border-radius: 8px; border: 1px solid #2a3a55;
      background: #121a2b; color: #e8eef7; font: inherit; }
    .row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.75rem; }
    button { padding: 0.55rem 0.9rem; border-radius: 8px; border: 1px solid #2a6df4;
      background: #1a3a7a; color: #fff; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; border-color: #94a3b8; }
    .card { margin-top: 1rem; padding: 1rem; border-radius: 10px; border: 1px solid #2a3a55; }
    .card.grant { border-color: #1f9d63; background: rgba(31,157,99,0.12); }
    .card.refuse { border-color: #d64545; background: rgba(214,69,69,0.12); }
    .delta { font-family: ui-monospace, monospace; font-size: 1.1rem; margin-top: 0.4rem; }
    a { color: #9ec5ff; }
  </style>
</head>
<body>
  <h1>Receipt Line Check</h1>
  <p class="lede">Narrower than Tip Jar: one receipt line claimed vs on-receipt. Starts empty — edit → Run.</p>
  <label>Line label<input id="label" value="Fuel" /></label>
  <label>Claimed $<input id="claimed" type="number" step="0.01" value="51.00" /></label>
  <label>On-receipt $<input id="interior" type="number" step="0.01" value="50.00" /></label>
  <div class="row">
    <button type="button" class="ghost" id="demoGrant">Demo GRANT</button>
    <button type="button" class="ghost" id="demoRefuse">Demo REFUSE</button>
    <button type="button" class="ghost" id="reset">Reset</button>
    <button type="button" id="run">Run line gate</button>
  </div>
  <div id="out" class="card" hidden></div>
  <p class="lede"><a href="/">← CeilingGate</a></p>
  <script>
    function money(n) { return "$" + Number(n).toFixed(2); }
    function show(c, n, label) {
      const ok = c <= n;
      const out = document.getElementById("out");
      out.hidden = false;
      out.className = "card " + (ok ? "grant" : "refuse");
      const d = c - n;
      out.innerHTML = "<strong>" + (ok ? "GRANT" : "REFUSE") + "</strong>" +
        "<p class='lede' style='margin:0.4rem 0 0'>" + label + ": claimed " + money(c) +
        " vs on-receipt " + money(n) + "</p>" +
        "<div class='delta'>" + (ok ? "Δ " + money(d) + " · clear" : "OVER " + money(d)) + "</div>";
    }
    document.getElementById("demoGrant").onclick = () => {
      document.getElementById("claimed").value = "49";
      document.getElementById("interior").value = "50";
      show(49, 50, document.getElementById("label").value || "Line");
    };
    document.getElementById("demoRefuse").onclick = () => {
      document.getElementById("claimed").value = "51";
      document.getElementById("interior").value = "50";
      show(51, 50, document.getElementById("label").value || "Line");
    };
    document.getElementById("reset").onclick = () => {
      document.getElementById("out").hidden = true;
      document.getElementById("out").innerHTML = "";
    };
    document.getElementById("run").onclick = () => {
      const c = Number(document.getElementById("claimed").value);
      const n = Number(document.getElementById("interior").value);
      show(c, n, document.getElementById("label").value || "Line");
    };
  </script>
</body>
</html>
