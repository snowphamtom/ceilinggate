name: lesson-card
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  card:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs: lesson card') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Write lesson card
        run: bash scripts/write-lesson-card.sh docs/LESSON_CARD.md
      - name: Commit if changed
        run: |
          git config user.name "ceilinggate-bot"
          git config user.email "yeti.monstersink@gmail.com"
          git add docs/LESSON_CARD.md
          if git diff --cached --quiet; then
            echo "card unchanged"
            exit 0
          fi
          git commit -m "docs: lesson card $(git rev-parse --short HEAD)"
          git push
