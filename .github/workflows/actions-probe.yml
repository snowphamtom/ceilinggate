name: actions-probe
on:
  push:
    branches: [aether/actions-probe]
  workflow_dispatch:
concurrency:
  group: actions-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Print run face
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "workflow=${{ github.workflow }}"
      - name: Secret present? (boolean only)"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY_present=true"
          else
            echo "CONVEX_DEPLOY_KEY_present=false"
          fi
          echo "key_not_printed"
      - name: Workspace glance
        run: |
          ls -la
          test -f package.json && echo "package.json=yes" || echo "package.json=no"
          test -f .github/workflows/convex-deploy.yml && echo "convex-deploy.yml=yes"
