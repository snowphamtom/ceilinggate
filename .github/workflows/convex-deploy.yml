name: convex-deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Deploy Convex + site
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          echo "secret_present=${{ secrets.CONVEX_DEPLOY_KEY != '' }}"
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY empty in this job."
            echo "Need Repository secret CONVEX_DEPLOY_KEY on snowphamtom/ceilinggate"
            echo "https://github.com/snowphamtom/ceilinggate/settings/secrets/actions"
            echo "Mint key: https://dashboard.convex.dev/d/quirky-rhinoceros-204/settings/deploy-keys"
            echo "Not Vercel. Not Environment secrets. Not this log."
            exit 1
          fi
          npx convex deploy -y
